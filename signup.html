<!DOCTYPE html>
<html>
    <head>
        <title>GANTHRO AUTH</title>
        <link rel ="stylesheet" href="signup.css">
    </head>
    <body>
        <div class="container">
            <section id="hero-image">

            </section>
            <h1>Create your account
            </h1>
            <p>welcome to Ganthro. Lets get you started</p>
            <form id="signupForm">
                <label>FULLNAME :</label>
                <input type="text" id="fullname" placeholder="enter fullname" required>
                <label>USERNAME :</label>
                <input type="text" id="username" placeholder="enter username" required>
                <label>EMAIL :</label>
                <input type="email" id="email" placeholder="enter email" required>
                <label>PASSWORD :</label>
                <input type="password" id="password" placeholder="enter password" required>
                <label>CONFIRM PASSWORD :</label>
                <input type="password" id="confirmpassword" placeholder="enter confirmpassword" required>
                <p id ="passwordError"></p>
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the 
                        <a href="#">Terms of Service</a>
                         and
                         <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="submit" id="createaccountbtn">Create Account</button>

            </form>
        </div>
        <script src="signup.js"></script>
    </body>
</html>
