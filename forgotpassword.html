<!DOCTYPE html>
<html>
<head>
    <title>GANTHROAUTH</title>
    <link rel="stylesheet" href="forgotpassword.css">
</head>
<body>

    <div class="container">

        <section id="reset-image">
            <img src="resetpassword-hero.jpg" alt="Reset Password">
        </section>

        <section class="reset-content">
            <h1>GANTHRO</h1>
            <h2>Reset Your Password</h2>

            <p>
                To reset your password, enter your email below and submit.
                An email will be sent to you with instructions about how to
                complete the process.
            </p>

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
            >

            <button type="submit" id="resetpasswordbtn">
                Reset Password
            </button>
            <p id="passwordError"></p>
        </section>

    </div>

    <script src="forgotpassword.js"></script>
</body>
</html>
