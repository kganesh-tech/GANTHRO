<!DOCTYPE html>
<html>
    <head>
        <title>GANTHRO AUTH</title>
        <link rel="stylesheet" href="resetpassword.css">
    </head>
    <body>
        <div class="container">
             <section id="reset-image">
            <img src="resetpassword-hero.jpg" alt="Reset Password">
        </section>
        <div class ="reset-content">

        <h1>GANTHRO</h1>
         <p>Reset your password</p>

         <label for="emailaddress">Email Address</label>
         <input type="text" id="email" required>

         <label for="newpassword">New Password</label>
         <input type="password" id="newpassword"required>

         <p class="password-hint">Must be at least 8 characters</p>
         <p class="password-hint">Does not contain your email address</p>

         <label for="confirmnewpassword">Confirm New Password</label>
         <input type="password" id="confirmnewpassword" required>

         <button type="submit" id="savepasswordbtn">Save Password</button>
         <p id="passwordError"></p>
        </div>
        </div>

        <script src="resetpassword.js"></script>
    </body>
</html>
